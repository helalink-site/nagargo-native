name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_NUMBER: ${{ github.run_number }}
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SITE_HOST_VAR: ${{ vars.SITE_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Decode keystore (only if secrets are set)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        if: env.KS_B64 != ''
        run: |
          EXTRA=""
          if [ -n "$SITE_HOST_VAR" ]; then EXTRA="-PSITE_HOST=$SITE_HOST_VAR"; fi
          gradle assembleRelease $EXTRA
      - name: Stop if the signing secrets are missing
        if: env.KS_B64 == ''
        run: |
          echo "Signing secrets are missing. A debug build would break updates for installed users."
          exit 1
      - name: Name the APK
        run: cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" NagarGo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NagarGo-apk
          path: NagarGo.apk
      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: NagarGo app ${{ github.run_number }}
          files: NagarGo.apk
